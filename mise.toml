# ─── Tools ───────────────────────────────────────────────────────────────────

[tools]
oxfmt = "latest"
ruff = "latest"

# ─── Data ────────────────────────────────────────────────────────────────────

[tasks.resample]
description = "Resample the 6in land cover by majority (args: resolutions in ft, default 3; --strips N to limit)"
run = "uv run resample.py"

[tasks.clear]
description = "Delete everything in out/"
run = "find out -mindepth 1 -delete 2>/dev/null || true"

# ─── Dev ─────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format files: oxfmt (md/yaml/toml/json) and ruff (Python)"
run = ["oxfmt", "ruff format"]

# ─── Release ─────────────────────────────────────────────────────────────────

[tasks.release]
description = "Set README citation version to the tag (commit), tag HEAD, push, and upload out/*.tif as GitHub release assets"
usage = 'arg "[tag]" help="Release tag (default: vYYYY.MM.DD, with .1, .2, … appended if taken)"'
run = 'scripts/release.sh ${usage_tag:-}'
