# ─── Tools ───────────────────────────────────────────────────────────────────

[tools]
oxfmt = "latest"
ruff = "latest"

# ─── Data ────────────────────────────────────────────────────────────────────

[tasks.resample]
description = "Resample the 6in land cover to 3ft (pass a strip count to limit)"
run = "uv run resample"

[tasks.clear]
description = "Delete everything in out/"
run = "find out -mindepth 1 -delete 2>/dev/null || true"

# ─── Dev ─────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format files: oxfmt (md/yaml/toml/json) and ruff (Python)"
run = ["oxfmt", "ruff format"]

# ─── Release ─────────────────────────────────────────────────────────────────

[tasks.release]
description = "Tag HEAD and push the tag; the Release workflow publishes out/nyc_landcover_2017_3ft.tif"
usage = 'arg "[tag]" help="Release tag (default: vYYYY.MM.DD)"'
run = 'scripts/release.sh ${usage_tag:-}'
